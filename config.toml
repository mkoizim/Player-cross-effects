# Pins for every external input. Change a pin => rebuild from `make clean data`.

[retrosheet]
url = "https://github.com/chadwickbureau/retrosheet.git"
sha = "ee82e50bad713c27df6ca12a81d206de4267e073"   # 2026-08-13

[chadwick]
url = "https://github.com/chadwickbureau/chadwick.git"
tag = "v0.9.5"
sha = "579c96ccb5c26f0c96e1e3eb26b9139c512587c1"

[seasons]
first = 2000
last = 2025

[definitions]
# Trailing window (days, excluding game day) used to infer who is in a bullpen.
bullpen_window_days = 14
# A player who starts at pitcher but has at least this many PA in the season
# is treated as a hitter (two-way players), not as a pitcher batting.
two_way_min_pa = 150
# Opener (user decision 2026-11-14): a start of at most this many batters by a pitcher who
# starts in fewer than this share of his appearances that season. The pitcher with the most
# batters faced in that game is then the de facto starter (used for H7 only).
opener_max_bf = 10
opener_max_start_share = 0.5

[talent]
# Prior-season weights (most recent first) for expected-matchup talent estimates.
season_weights = [5, 4, 3]

[valuation]
# External assumptions, not estimated here. Used only to express run values in dollars.
runs_per_win = 10.0            # conventional rule of thumb
# FanGraphs, "What Are Teams Paying For A Win In Free Agency? 2026 Edition" (Feb 2026), read in
# full: 2025-26 free agents received $11.23M per projected WAR overall; by tier, $6.74M for
# players projected under 1 WAR and $12.84M for those projected at 2 or more.
dollars_per_win = 11.23e6
dollars_per_win_low = 6.74e6
dollars_per_win_high = 12.84e6
