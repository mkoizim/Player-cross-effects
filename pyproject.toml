[project]
name = "pce"
version = "0.1.0"
description = "Player cross-effects: lineup handedness mix and pitcher deployment"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyfixest>=0.70.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
